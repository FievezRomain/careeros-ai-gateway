name: Security baseline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install uv==0.13.9
      - run: uv sync --locked --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest
      - run: uv run pip-audit && uv run bandit -q -r src
      - uses: actions/checkout@v4
        with:
          repository: FievezRomain/careeros-workspace
          ref: 45d7c053de98c533504f77dc801ee4031c0f4c89
          path: .careeros-workspace
      - run: uv run python .careeros-workspace/scripts/check_service_quality.py .

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
